[package]
name = "pylon-stream-sender"
version = "0.1.0"
edition = "2021"
description = "Pylon Stream Windows 发送端：DXGI 采集 + Media Foundation H.264 硬编码 + UDP 群发"

[[bin]]
name = "pylon-stream-sender"
path = "src/main.rs"

[dependencies]
# windows crate：纯 FFI 绑定，不需要 MSVC 或独立 Windows SDK
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Media_MediaFoundation",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
