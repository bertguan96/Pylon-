[package]
name = "pylon-vnc"
version = "0.1.0"
edition = "2021"
description = "Pylon 的原生 VNC 引擎：RFB 协议、ZRLE 解码、脏块比对全部在进程内完成"

[[bin]]
name = "pylon-vnc"
path = "src/main.rs"

[dependencies]
# zlib-rs：纯 Rust 的 zlib 实现（libz-rs-sys），性能接近 zlib-ng，
# 依然不需要 C 工具链，交叉编译到 gnu 目标不受影响
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
